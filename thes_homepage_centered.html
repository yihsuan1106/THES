<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>THES 社團法人台灣高等教育學會</title>

  <style>
    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      font-family: Arial, "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: #000;
    }

    .homepage {
      position: relative;
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .background {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: center;
    }

    .overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.35);
    }

    .content {
      position: relative;
      z-index: 2;
      width: 100%;
      height: 100%;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      text-align: center;
      color: white;
      box-sizing: border-box;
      padding: 24px;
    }

    .title {
      margin: 0 0 18px 0;
      font-size: 48px;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .message {
      margin: 0 0 28px 0;
      font-size: 24px;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.8);
    }

    .enter-button {
      display: inline-block;
      padding: 14px 32px;
      border-radius: 10px;
      background: white;
      color: #222;
      font-size: 20px;
      font-weight: 700;
      text-decoration: none;
      transition: transform 0.2s ease, background 0.2s ease;
    }

    .enter-button:hover {
      transform: scale(1.05);
      background: #f0f0f0;
    }

    @media (max-width: 768px) {
      .title {
        font-size: 34px;
      }

      .message {
        font-size: 20px;
      }

      .enter-button {
        font-size: 18px;
        padding: 12px 26px;
      }
    }
  </style>
</head>

<body>

  <div class="homepage">

    <img
      class="background"
      src="IMG_3273.JPG"
      alt="THES 社團法人台灣高等教育學會背景圖片"
    />

    <div class="overlay"></div>

    <div class="content">
      <h1 class="title">THES 社團法人台灣高等教育學會</h1>

      <p class="message">請使用google chrome瀏覽器</p>

      <a
        class="enter-button"
        href="https://sites.google.com/view/thes20051202?usp=sharing"
      >
        點此進入
      </a>
    </div>

  </div>

</body>
</html>
